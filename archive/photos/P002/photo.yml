id: P002
subject: Dad with two dogs; the dog on the left is Snoopy, his dog in Vietnam (Andy, 2026-11-10)
description: >-
  Black-and-white print. A young man with short hair and dark sunglasses, in a short-sleeved
  shirt, sits on sandy ground with an arm around each of two dogs: a dark, short-haired dog on
  the left and a light dog with dark spots and upright ears on the right. Open, grassy ground
  behind, with a thin pole at the top. The print is damaged: a crease runs across the upper half
  and much of the lower half has lost its surface.
