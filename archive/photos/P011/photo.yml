id: P011
subject: "Army Commendation Medal certificate awarded to Specialist Four Thomas Jafuta (Dad), dated 30 August 1969"
description: >-
  Printed Department of the Army certificate with a green ribbon and bronze medal at the top,
  filled in by typewriter: "Specialist Four Thomas Jafuta, [number withheld], United States Army",
  "for meritorious achievement in the Republic of Vietnam during the period June 1969 to July 1969",
  "given under my hand in the city of Washington this thirtieth day of August 1969". Signed by
  Winant Sidle, Brigadier General, USA, and Stanley R. Resor, Secretary of the Army, with the War
  Office seal between. Handwritten at top right: "Please return to me. Thank you." (cut off at the
  right edge in the copy).
date: 1969-08-30      # as printed on the certificate
