id: P008
subject: "Newspaper clipping, \"20 Honored for Aiding Police Work\", naming Thomas P. Jafuta, 28 (Dad), and his friend Ronnie (Ronald C. Gorsche) (Andy, 2026-11-10)"
description: >-
  Yellowed newspaper clipping, one column. Headline "20 Honored for Aiding Police Work". The
  article lists people given citizen awards of merit by Milwaukee Police Chief Harold Breier,
  among them "Ronald C. Gorsche, 34, and Thomas P. Jafuta, 28, who helped capture two thieves
  who were charged with battery and auto theft." Dated by hand down the left margin: 1976, with
  a month before it read as [possible reading: Jan.] or [possible reading: June].
