id: P012
subject: "Typed citation for the Army Commendation Medal awarded to Specialist Four Thomas P. Jafuta (Dad) for meritorious service, September 1968 – August 1969"
description: >-
  One typed page headed "The Army Commendation Medal is awarded to Specialist Four Thomas P. Jafuta,
  [number withheld], United States Army, for meritorious service: Citation". It names him senior field
  wireman with Headquarters and Headquarters Battery, 3d Battalion, 6th Artillery, and credits him
  with the wiring of the battalion base camp area, wiring a new tactical operations center at Landing
  Zone Oasis, and instructing replacement personnel in the communications section. Handwritten at
  right: "Original copy. Please return."
