  - "Verified fact: the Citizens Award of Merit presentation was on 27 January 1976, in Chief Breier's office. This dates the clipping P008 (its handwritten month was read as Jan. or June) to January 1976."
  - "Verified fact (family): P010 (the awards being presented) is the photograph this letter enclosed (Andy, 2026-11-25: \"The photo is confirmed.\")."
  - "The letter says the presentation was in the Chief's office; it does not say who handed over the awards."
