id: P013
subject: "Letter from the Milwaukee Police Department to Mr. and Mrs. Thomas P. Jafuta (Dad and Mom), 30 January 1976, sending the photograph taken at the Citizens Award of Merit presentation"
description: >-
  Typed letter on City of Milwaukee, Department of Police letterhead (
  Police Administration Building; "Harold A. Breier, Chief of Police"; Bicentennial seals at the
  foot). Dated January 30, 1976, addressed to "Mr. and Mrs. Thomas P. Jafuta", East Troy,
  Wisconsin: "Enclosed is the photograph which was taken at the Citizens Award of Merit
  presentation in the office of Chief of Police Harold A. Breier on January 27, 1976. Thank you
  again for your cooperation in this matter." Signed for the Chief by Andrew J. Busalacchi,
  Captain of Police, Personnel Bureau. "AJB:nf", "Enclosure".
date: 1976-01-30      # as typed on the letter
place: Milwaukee, Wisconsin
